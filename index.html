<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notification Tester</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f4f9;
        }
        .container {
            text-align: center;
            padding: 20px;
        }
        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: background-color 0.2s;
        }
        button:active {
            background-color: #0056b3;
        }
        p {
            color: #666;
            margin-top: 15px;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Notification Sound Tester</h2>
        <button id="notifyBtn">Send Test Notification</button>
        <p id="status"></p>
    </div>

    <script>
        const button = document.getElementById('notifyBtn');
        const statusText = document.getElementById('status');

        button.addEventListener('click', async () => {
            // Check if the browser supports notifications
            if (!("Notification" in window)) {
                alert("This browser does not support notifications.");
                return;
            }

            // Request permission from the user
            let permission = Notification.permission;
            
            if (permission !== "granted") {
                permission = await Notification.requestPermission();
            }

            if (permission === "granted") {
                statusText.textContent = "Notification sent!";
                
                // On mobile Android browsers, Service Workers are typically required 
                // for background pushes, but standard Notifications work if the tab is open.
                const options = {
                    body: "This is a test to check your notification sound.",
                    icon: "https://devworld.run.place/woym.png",
                    badge: "https://devworld.run.place/woym.png"
                };

                // Use Service Worker registration if available (best practice for Android Chrome)
                if ('serviceWorker' in navigator && navigator.serviceWorker.controller) {
                    navigator.serviceWorker.ready.then(registration => {
                        registration.showNotification("Test Notification!", options);
                    });
                } else {
                    // Fallback to standard web notification
                    new Notification("Test Notification!", options);
                }
            } else {
                statusText.textContent = "Notification permission denied.";
            }
        });
    </script>
</body>
</html>
