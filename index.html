<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notification Tester</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f4f9;
        }
        .container {
            text-align: center;
            padding: 20px;
        }
        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        button:active {
            background-color: #0056b3;
        }
        p {
            color: #666;
            margin-top: 15px;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Notification Sound Tester</h2>
        <button id="notifyBtn">Send Test Notification</button>
        <p id="status"></p>
    </div>

    <script>
        const button = document.getElementById('notifyBtn');
        const statusText = document.getElementById('status');

        // Register a Service Worker immediately (Required for Android Chrome)
        let swRegistration = null;
        if ('serviceWorker' in navigator) {
            const swCode = `self.addEventListener('notificationclick', e => e.notification.close());`;
            const blob = new Blob([swCode], { type: 'application/javascript' });
            const swUrl = URL.createObjectURL(blob);

            navigator.serviceWorker.register(swUrl).then(reg => {
                swRegistration = reg;
            }).catch(err => {
                console.error('Service Worker registration failed:', err);
            });
        }

        button.addEventListener('click', async () => {
            if (!("Notification" in window)) {
                statusText.textContent = "This browser does not support notifications.";
                return;
            }

            let permission = Notification.permission;
            if (permission !== "granted") {
                permission = await Notification.requestPermission();
            }

            if (permission === "granted") {
                statusText.textContent = "Sending notification...";

                const title = "Test Notification!";
                const options = {
                    body: "This is a test to check your notification sound.",
                    icon: "https://devworld.run.place/woym.png",
                    badge: "https://devworld.run.place/woym.png"
                };

                // Use Service Worker notification (required for mobile)
                if (swRegistration) {
                    try {
                        await swRegistration.showNotification(title, options);
                        statusText.textContent = "Notification sent!";
                    } catch (err) {
                        statusText.textContent = "Error: " + err.message;
                    }
                } else {
                    // Fallback for desktop browsers
                    try {
                        new Notification(title, options);
                        statusText.textContent = "Notification sent!";
                    } catch (err) {
                        statusText.textContent = "Service worker loading... try clicking again in a second.";
                    }
                }
            } else {
                statusText.textContent = "Notification permission denied.";
            }
        });
    </script>
</body>
</html>
